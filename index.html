<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha-Beasts ABC</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3A86FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alpha-Beasts">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#BFE3FF; --ink:#1D2B4F; --paper:#FFFFFF; --muted:#5B6A8C;
  --vowels:#E63946; --mobster:#6A4C93; --horde:#2A9D8F; --stealth:#264653;
  --authority:#D89A00; --outlaw:#4A4A4A; --place:#3A86FF; --unknown:#F08A24;
  --night:#34406B; --lock:#9AA6BF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#12223F; --ink:#EEF3FF; --paper:#1C2E52; --muted:#A9B6D3; --lock:#4E5A74; }
}
:root[data-theme="dark"]{ --sky:#12223F; --ink:#EEF3FF; --paper:#1C2E52; --muted:#A9B6D3; --lock:#4E5A74; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);
  font-family:"Andika","Trebuchet MS",Verdana,sans-serif;font-size:1.125rem;line-height:1.5}
body.night{background:#0E1430;color:#DCE3FF}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{cursor:default}
.wrap{max-width:560px;margin:0 auto;padding:1rem 1rem 3rem}
h1,h2{font-family:"Lilita One","Arial Rounded MT Bold",sans-serif;font-weight:400;margin:0;line-height:1.1}
h1{font-size:2rem;white-space:nowrap} h2{font-size:1.6rem}
.top{display:flex;align-items:center;gap:.8rem;margin:.5rem 0 1rem}
.pill{background:var(--paper);border-radius:999px;padding:.45rem 1rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
.hello{color:var(--muted);margin:.2rem 0 1rem}

/* Chunky alphabet blocks */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.block{position:relative;aspect-ratio:1;border-radius:14px;background:var(--c);color:#fff;
  font-weight:700;font-size:2.4rem;line-height:1;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s}
.block:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.block.locked{background:var(--lock)}
.block.wrong{opacity:.3}
.block .badge{position:absolute;right:6px;bottom:4px;font-size:.9rem}
.block small{display:block;font-size:.72rem;font-weight:700;margin-top:.25rem;line-height:1.1}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.tile{background:var(--c);color:#fff;border-radius:18px;padding:1rem .8rem;text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.28);min-height:6.2rem;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile .ic{font-size:2rem;line-height:1}
.tile b{font-size:1.15rem}
.tile span.n{font-size:.85rem;opacity:.9}

.card{background:var(--paper);border-radius:22px;padding:1.3rem;box-shadow:0 6px 0 rgba(0,0,0,.15);text-align:center}
.card + .card{margin-top:1rem}
.big{display:inline-grid;place-items:center;width:9rem;height:9rem;border-radius:22px;background:var(--c);color:#fff;
  font-size:6rem;font-weight:700;box-shadow:0 8px 0 rgba(0,0,0,.28);margin:.5rem 0 1rem}
.say{font-size:1.5rem;font-weight:700;margin:.2rem 0}
.sub{color:var(--muted);margin:0 0 .6rem}
.count{color:var(--muted);margin:0 0 .4rem;font-weight:700}
.emoji{font-size:5rem;line-height:1.2}
.medal{font-size:6rem;line-height:1.2}
.row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.btn{background:var(--c,var(--place));color:#fff;border-radius:14px;padding:.8rem 1.2rem;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.btn.huge{font-size:1.6rem;padding:1rem 2.4rem}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.opts{display:flex;gap:.9rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.opts .block{width:5.5rem;font-size:3rem}
.opts.wide .block{width:6.5rem;font-size:2.2rem;padding:.4rem}
.feedback{min-height:2rem;font-weight:700;margin-top:1rem}
input,select{font:inherit;padding:.5rem .7rem;border-radius:12px;border:3px solid var(--muted);background:#fff;color:#1D2B4F;width:100%}
label{display:block;text-align:left;font-weight:700;margin:.6rem 0 .2rem}
.note{font-size:.9rem;color:var(--muted);margin-top:1rem}
canvas{display:block;width:100%;max-width:360px;margin:0 auto;aspect-ratio:1;background:#fff;border-radius:18px;touch-action:none;
  box-shadow:inset 0 0 0 3px var(--c,var(--muted))}
.palette{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--s);box-shadow:0 3px 0 rgba(0,0,0,.25);border:3px solid #fff}
.swatch.on{outline:4px solid var(--ink);outline-offset:1px}
.toggle.on{outline:3px solid var(--ink)}

/* Relay */
.lanes{display:grid;gap:.6rem;margin:1rem 0;text-align:left}
.lane{position:relative;height:3.2rem;border-radius:12px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 24.6%,rgba(0,0,0,.2) 24.6% 25%)}
.lane.me{box-shadow:inset 0 0 0 3px var(--ink)}
.runner{position:absolute;top:.3rem;width:2.6rem;height:2.6rem;border-radius:10px;background:var(--c);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:1.4rem;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.legs{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-weight:700}

/* Joust */
.bar{position:relative;height:3rem;border-radius:12px;background:#E4E9F5;margin:1.2rem 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#FFD166}
.zone.inner{background:#06D6A0}
.marker{position:absolute;top:-.2rem;bottom:-.2rem;width:.7rem;margin-left:-.35rem;background:var(--ink);border-radius:4px}
.vs{display:flex;justify-content:space-around;align-items:center;font-weight:700}
.vs .runner{position:static;width:4rem;height:4rem;font-size:2rem;margin:0 auto .3rem}

/* Chicken */
.bushes{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:1rem}
.bush{aspect-ratio:1;border-radius:14px;background:#7BC96F;font-size:2.2rem;box-shadow:0 5px 0 #4E9A44}
.bush:disabled{background:#E4E9F5;box-shadow:none}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.mini{aspect-ratio:3/4;border-radius:14px;background:var(--c);color:#fff;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3rem;border:4px solid #F2C94C}
.mini.locked{background:var(--lock);border-color:transparent}
.mini .ml{font-size:2.2rem;line-height:1}
.mini .mn{font-size:.8rem;text-align:center;line-height:1.15;margin-top:.3rem}
.beastcard{background:var(--c);color:#fff;border-radius:22px;padding:1.2rem;border:6px solid #F2C94C;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:left}
.bc-top{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.bc-l{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:14px;background:rgba(255,255,255,.2);font-size:3rem;font-weight:700}
.beastcard dl{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;margin:0;background:rgba(0,0,0,.18);border-radius:14px;padding:.9rem}
.beastcard dt{opacity:.85}
.beastcard dd{margin:0;font-weight:700}

/* Stickers & standings */
.stickers{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
.stk{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;border:3px dashed var(--lock);color:var(--lock)}
.stk.got{background:var(--c);border:3px solid #fff;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(var(--r))}
.medals{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;font-size:2rem}
table{width:100%;border-collapse:collapse;text-align:left}
td{padding:.7rem .4rem;border-bottom:2px solid #E4E9F5}
td.p{font-weight:700;width:2.2rem}
td.pts{text-align:right;font-weight:700}
.chip{display:inline-block;width:1rem;height:1rem;border-radius:4px;background:var(--c);vertical-align:-2px;margin-right:.5rem}
tr.me td{background:rgba(58,134,255,.12)}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
.gallery button img{width:100%;border-radius:14px;display:block;background:#fff}
.gallery button span{display:block;font-weight:700;font-size:.9rem;margin-top:.3rem}

/* Bedtime */
.nightbox{text-align:center;padding-top:10vh}
.nightbox .big{background:#2A3566;color:#F6E7A8;box-shadow:none;transition:opacity 1s}
.nightbox p{color:#AEB9E6;font-size:1.4rem}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:.8rem 1.2rem;border-radius:14px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:9;max-width:90vw;text-align:center}
/* Board game */
.board{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:18px}
.tok{transition:transform .28s ease}
.hud{display:grid;gap:.4rem;margin:.8rem 0;text-align:left}
.pl{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:12px;background:rgba(0,0,0,.04)}
.pl.now{box-shadow:inset 0 0 0 3px var(--ink);background:rgba(58,134,255,.12)}
.pl .runner{position:static;width:2rem;height:2rem;font-size:1.1rem;flex:none}
.pl .bs{margin-left:auto;font-size:1.1rem;letter-spacing:1px}
.dice{font-size:3.6rem;line-height:1;width:5.5rem;height:5.5rem;border-radius:18px;background:#fff;color:#1D2B4F;box-shadow:0 6px 0 rgba(0,0,0,.25);border:3px solid #1D2B4F}
.dice:disabled{opacity:.55}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:.6rem}
.pick .block{font-size:1.8rem}
.pick .block small{font-size:.62rem}
.pick .block.taken{opacity:.25}
@media (prefers-reduced-motion: reduce){.tok{transition:none}}
/* Outlaws */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1rem}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 65%,#5C4331 0 45%,#8D6A4F 46% 100%);position:relative;overflow:hidden}
.hole .pop{position:absolute;left:14%;right:14%;top:12%;bottom:12%;border-radius:14px;background:var(--c);color:#fff;font-weight:700;font-size:2.2rem;
  display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.3);animation:up .15s ease-out}
.hole .pop small{position:absolute;top:-2px;right:2px;font-size:1.1rem}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.seq{display:flex;gap:.5rem;justify-content:center;margin:.6rem 0}
.seq .block{width:3.6rem;font-size:2rem;display:grid;place-items:center}
.seq .gap{background:#fff;color:var(--ink);border:3px dashed var(--ink);box-shadow:none}
.clues{text-align:left;margin:.6rem 0;padding:0;list-style:none}
.clues li{background:rgba(0,0,0,.05);border-radius:12px;padding:.5rem .8rem;margin-bottom:.4rem;font-weight:700}
.stars{font-size:1.4rem;letter-spacing:2px}
@media (prefers-reduced-motion: reduce){.hole .pop{animation:none}}
/* Adopt a beast */
.petcard{background:var(--paper);border-radius:22px;padding:1.2rem;box-shadow:0 6px 0 rgba(0,0,0,.15);text-align:center;position:relative;overflow:hidden}
.pet-stage{position:relative;height:13rem;display:grid;place-items:center;margin-top:.4rem}
.pet{position:relative;width:9.5rem;height:9.5rem;border-radius:30px;background:var(--c);box-shadow:0 10px 0 rgba(0,0,0,.25);animation:bob 2.6s ease-in-out infinite}
.pet .eyes{position:absolute;top:26%;left:0;right:0;display:flex;justify-content:center;gap:1.6rem}
.pet .eye{width:1.7rem;height:1.9rem;background:#fff;border-radius:50%;position:relative;animation:blink 4.5s infinite}
.pet .eye::after{content:"";position:absolute;width:.8rem;height:.9rem;background:#1D2B4F;border-radius:50%;left:.45rem;top:.55rem}
.pet .mouth{position:absolute;top:52%;left:50%;width:2.6rem;height:1.2rem;margin-left:-1.3rem;border-bottom:.45rem solid #1D2B4F;border-radius:0 0 50% 50%}
.pet.eating .mouth{height:1.6rem;width:1.6rem;margin-left:-.8rem;border:none;background:#1D2B4F;border-radius:50%}
.pet .cheek{position:absolute;top:50%;width:1rem;height:.6rem;border-radius:50%;background:rgba(255,255,255,.35)}
.pet .cheek.l{left:14%} .pet .cheek.r{right:14%}
.pet .belly{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:1.5rem;width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center}
.pet.jump{animation:jump .5s ease}
.pet.grow{animation:grow .9s ease}
.treat{position:absolute;font-size:2.4rem;left:50%;bottom:0;transform:translateX(-50%);animation:toss .7s ease-in forwards;pointer-events:none}
.hearts{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:1.6rem;animation:rise 1.2s ease-out forwards;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-26px) scale(1.05)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes toss{0%{bottom:0;opacity:1}100%{bottom:55%;opacity:0;transform:translateX(-50%) scale(.5)}}
@keyframes rise{0%{top:40%;opacity:1}100%{top:-10%;opacity:0}}
.xpbar{height:.9rem;border-radius:999px;background:#E4E9F5;overflow:hidden;margin:.4rem 0 .2rem}
.xpbar span{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .4s}
.pantry{font-size:1.2rem;font-weight:700;margin:.6rem 0}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.6rem}
.step{border-radius:14px;padding:.5rem .2rem;background:rgba(0,0,0,.05);font-size:.8rem;font-weight:700;line-height:1.2}
.step .i{font-size:1.6rem;display:block}
.step.done{background:#FFF3C4;box-shadow:inset 0 0 0 3px #F2C94C}
.tile.wide{grid-column:1/-1;min-height:5.2rem;flex-direction:row;align-items:center;justify-content:flex-start;gap:1rem}
.link-btn{background:none;color:var(--muted);text-decoration:underline;font-size:.9rem;margin-top:.8rem}
@media (prefers-reduced-motion: reduce){.pet,.pet .eye{animation:none}.treat,.hearts{display:none}}
.slwrap{position:relative}
.sl3d{width:100%;aspect-ratio:3/4;max-height:72vh;border-radius:16px;overflow:hidden;background:#9ED8F5;touch-action:none;display:grid;place-items:center}
.sl3d canvas{max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:none;margin:0;display:block}
.slhud{position:absolute;top:.5rem;left:.5rem;right:3.4rem;display:flex;flex-wrap:wrap;gap:.35rem;pointer-events:none}
.slp{display:flex;align-items:center;gap:.35rem;background:rgba(29,43,79,.82);color:#fff;border-radius:999px;padding:.2rem .6rem .2rem .2rem;font-size:.78rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.slp.now{outline:3px solid #FFD166}
.slp .av{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:.95rem;border:2px solid #fff}
.slp .sq{background:#FFD166;color:#1D2B4F;border-radius:999px;padding:0 .4rem}
.slview{position:absolute;top:.5rem;right:.5rem;width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;font-size:1.2rem;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.slview.slme{top:3.3rem}
.slview.on{outline:3px solid #FFD166}
.dicebox{position:absolute;bottom:.8rem;right:.8rem;width:4.6rem;height:4.6rem;perspective:300px;background:none}
.dicebox .cube{position:relative;width:3.4rem;height:3.4rem;margin:.6rem;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.3,1)}
.dicebox .f{position:absolute;inset:0;background:#fff;border-radius:10px;border:2px solid #d9dde8;display:grid;grid-template-columns:repeat(3,1fr);padding:.35rem;gap:.1rem}
.dicebox .f i{border-radius:50%} .dicebox .f i.p{background:#1D2B4F}
.dicebox .f1{transform:translateZ(1.7rem)} .dicebox .f6{transform:rotateY(180deg) translateZ(1.7rem)}
.dicebox .f2{transform:rotateY(90deg) translateZ(1.7rem)} .dicebox .f5{transform:rotateY(-90deg) translateZ(1.7rem)}
.dicebox .f3{transform:rotateX(90deg) translateZ(1.7rem)} .dicebox .f4{transform:rotateX(-90deg) translateZ(1.7rem)}
.dicebox.ready{animation:nudge 1.4s ease-in-out infinite}
.dicebox:disabled{opacity:.85}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.dpad{display:grid;justify-items:center;gap:.4rem;margin-top:.6rem}.dpad>div{display:flex;gap:.4rem}.dpad .btn{width:3.6rem;height:3.2rem;padding:0;font-size:1.3rem;touch-action:none;user-select:none}
.btn,.block,.tile,.dicebox,.slwrap,.sl3d,.dpad,.pill{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.hunt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
.hunt-item{display:flex;align-items:center;gap:.5rem;text-align:left;background:#F3F5FA;border-radius:14px;padding:.6rem .7rem;font-weight:700;font-size:.95rem;color:#1D2B4F;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hunt-item .tick{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:3px solid #C9D1E3;display:grid;place-items:center;color:#fff;font-size:1rem}
.hunt-item.got{background:#E8F8EF}.hunt-item.got .tick{background:#06D6A0;border-color:#06D6A0}
.spot{width:3.6rem;height:3.6rem;border-radius:50%;border:3px dashed #9AA6BF;font-size:1.6rem;font-weight:700;color:#9AA6BF;background:#fff}
.spot.got{background:var(--c);border:3px solid #fff;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.passport{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-top:.8rem}
.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed #C9D1E3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9AA6BF}
.stamp .sl{font-size:1.6rem;font-weight:700}.stamp .sm{font-size:.65rem;font-weight:700}
.stamp.cur{border-color:var(--c);color:var(--c)}
.stamp.got{background:var(--c);border:4px double #fff;color:#fff;transform:rotate(var(--r));box-shadow:0 3px 0 rgba(0,0,0,.25)}
.cabinet{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem .5rem;margin-top:.8rem;padding:1rem .6rem 1.2rem;border-radius:18px;
  background:linear-gradient(180deg,#7A4E2C,#5E3A20);box-shadow:inset 0 0 0 6px #8D5B3C,inset 0 0 0 10px #4A2E14,0 6px 0 rgba(0,0,0,.2);
  background-image:repeating-linear-gradient(180deg,transparent 0 5.2rem,#4A2E14 5.2rem 5.55rem),linear-gradient(180deg,#7A4E2C,#5E3A20)}
.mslot{display:flex;flex-direction:column;align-items:center;position:relative;height:4.6rem}
.mslot .rib{width:1.5rem;height:1.2rem;background:#3a2a1a;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);opacity:.5}
.mslot .coin{width:2.7rem;height:2.7rem;margin-top:-.2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;
  background:#3a2a1a;color:#8a6a4a;box-shadow:inset 0 0 0 3px #4A2E14}

const DEF = {unlocked:false,traced:{},correct:{},cards:{},team:null,pts:{vowels:0,mobster:0,horde:0,stealth:0},name:"",medals:[]};

/* ================= HELPERS ================= */
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const col = b => `var(${T[b.team]})`;
const tcol = t => `var(${T[t]})`;
const byL = l => BEASTS[l.charCodeAt(0)-65];
const isOpen = i => S.unlocked || i < FREE;
const openBeasts = () => BEASTS.filter((b,i)=>isOpen(i));
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const nm = b => b.spoken || b.name;
const line = b => b.team === "place"
  ? `${SAY[b.l]} is for ${b.name}!`
  : `${SAY[b.l]} is for ${nm(b)}${b.animal ? ", the " + b.animal : ""}!`;
/* ================= LETTER SOUNDS (phonics) ================= */
const SAY_NAMES = {...SAY};
const PHON = {A:"ah",B:"buh",C:"kuh",D:"duh",E:"eh",F:"fuh",G:"guh",H:"huh",I:"ih",J:"juh",K:"kuh",L:"luh",M:"muh",N:"nuh",O:"oh",P:"puh",Q:"kwuh",R:"ruh",S:"suh",T:"tuh",U:"uh",V:"vuh",W:"wuh",X:"ks",Y:"yuh",Z:"zuh"};
function applySounds(){ const m = S.sounds || "names"; Object.keys(SAY_NAMES).forEach(l => { SAY[l] = m === "phonics" ? PHON[l] : m === "both" ? `${SAY_NAMES[l]}, ${PHON[l]}` : SAY_NAMES[l]; }); }
applySounds();
const SOUND_MODES = [["names","🔤 Letter names","Ay, Bee, See"],["phonics","🗣️ Letter sounds","ah, buh, kuh"],["both","🔁 Both","Ay says ah"]];
function soundPicker(after){
  return `<div class="soundpick">${SOUND_MODES.map(([k, n, ex]) => `<button class="btn ${ (S.sounds || "names") === k ? "" : "ghost"}" data-snd="${k}">${n}<br><small>${ex}</small></button>`).join("")}</div>`;
}
function wireSoundPicker(redraw){
  app.querySelectorAll("[data-snd]").forEach(el => el.onclick = () => { S.sounds = el.dataset.snd; save(); applySounds(); speak(S.sounds === "phonics" ? "ah, buh, kuh" : S.sounds === "both" ? "Ay says ah. Bee says buh." : "Ay, Bee, See"); redraw(); });
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let CLEAN = [], EPOCH = 0;
function leave(){ CLEAN.forEach(f=>{try{f()}catch(e){}}); CLEAN = []; EPOCH++; stopAudio(); try{speechSynthesis.cancel()}catch(e){} document.body.classList.remove("night"); }
function later(fn, ms){ const ep = EPOCH; const t = setTimeout(()=>{ if(ep===EPOCH) fn(); }, ms); CLEAN.push(()=>clearTimeout(t)); }

const ART_AR = { C: 0.7558 };
function artSprite(T3, l, h){
  const tex = new T3.TextureLoader().load(ART[l]); if (T3.sRGBEncoding && tex.encoding !== undefined) {}
  const sp = new T3.Sprite(new T3.SpriteMaterial({map: tex, transparent: true, alphaTest: 0.08}));
  sp.scale.set(h*(ART_AR[l] || 0.75), h, 1); if (sp.center) sp.center.set(0.5, 0.3); sp.userData = {art: true, base: [h*(ART_AR[l] || 0.75), h]}; return sp;
}
const ART_IMG = {}; Object.keys(ART).forEach(l => { const im = new Image(); im.src = ART[l]; ART_IMG[l] = im; });
function setTokenScale(m, k){ if (m.userData && m.userData.art){ m.scale.set(m.userData.base[0]*k, m.userData.base[1]*k, 1); } else m.scale.set(k, k, k); }
function decorateArt(root){
  root.querySelectorAll(".block").forEach(el => {
    let l = el.dataset.l; if (!l && el.dataset.i != null && BEASTS[+el.dataset.i]) l = BEASTS[+el.dataset.i].l;
    if (!l || !ART_HEAD[l] || el.classList.contains("hasart")) return;
    el.classList.add("hasart"); el.insertAdjacentHTML("afterbegin", `<img class="artface" src="${ART_HEAD[l]}" alt="">`); });
}

try{ if (navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}   // iPhone: play music/effects even with the silent switch on
function applyMute(){ if (S.mute){ try{ stopAudio(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} try{ MUSIC.stop(); }catch(e){} } document.querySelectorAll("[data-mute]").forEach(b => b.textContent = S.mute ? "🔇" : "🔊"); }
document.addEventListener("click", e => { const m = e.target.closest && e.target.closest("[data-mute]"); if (!m) return; S.mute = !S.mute; save(); applyMute(); if (!S.mute) speak("Sound on!"); });
const buzz = p => { try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} };
function confetti(){
  const c = document.createElement("canvas"); c.className = "confetti"; c.width = innerWidth*Math.min(2, devicePixelRatio || 1); c.height = innerHeight*Math.min(2, devicePixelRatio || 1); document.body.appendChild(c);
  const g = c.getContext("2d"), k = c.width/innerWidth, cols = ["#E63946","#F08A24","#FFD166","#06D6A0","#3A86FF","#6A4C93","#F497C4"];
  const bits = Array.from({length: 140}, () => ({x: innerWidth/2 + (Math.random() - .5)*120, y: innerHeight*0.35, vx: (Math.random() - .5)*14, vy: -Math.random()*14 - 4, r: Math.random()*6, vr: (Math.random() - .5)*0.4, c: cols[Math.floor(Math.random()*7)], w: 6 + Math.random()*6, h: 4 + Math.random()*4}));
  const t0 = performance.now(); const step = now => { const t = (now - t0)/1000; g.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => { b.vy += 0.45; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr; g.save(); g.translate(b.x*k, b.y*k); g.rotate(b.r); g.globalAlpha = Math.max(0, 1 - t/2.2); g.fillStyle = b.c; g.fillRect(-b.w*k/2, -b.h*k/2, b.w*k, b.h*k); g.restore(); });
    if (t < 2.3) requestAnimationFrame(step); else c.remove(); }; requestAnimationFrame(step);
}
function render(html){ leave(); app.innerHTML = html; try{ decorateArt(app); }catch(e){} window.scrollTo(0,0); }
const header = (title, back="home", label="Home") =>
  `<div class="top"><button class="pill" data-go="${back}">‹ ${label}</button><h2>${title}</h2><button class="pill mutebtn" data-mute aria-label="Sound on or off">${S.mute ? "🔇" : "🔊"}</button></div>`;

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

/* ================= VOICE ================= */
const FEMALE = /female|woman|serena|kate|stephanie|martha|libby|sonia|hazel|susan|fiona|moira|tessa|karen|samantha|victoria|zira|amy|emma/i;
const MALE = /\bmale\b|daniel|arthur|oliver|george|ryan|thomas|james|fred|alex|david|mark|rishi/i;
let voice = null;
function pickVoice(){
  try{
    const all = speechSynthesis.getVoices();
    const gb = all.filter(v => /en[-_]GB/i.test(v.lang));
    const en = all.filter(v => /^en/i.test(v.lang));
    const nice = /premium|enhanced|natural|neural/i;
    voice = gb.find(v => FEMALE.test(v.name) && nice.test(v.name)) || gb.find(v => FEMALE.test(v.name))
         || gb.find(v => !MALE.test(v.name)) || en.find(v => FEMALE.test(v.name)) || gb[0] || null;
  }catch(e){}
}
/* Natural voice: recorded AI clips from /api/tts (cached forever after the first play); falls back to the phone voice */
let NV_OK = location.protocol.startsWith("http") && !/claude\.ai|claudeusercontent/.test(location.hostname), NV_FAILS = 0, curAudio = null;
/* One shared player, unlocked by the first tap, so iPhones allow every later line (next page, next round…) to play too */
const NVA = new Audio(); NVA.preload = "auto"; let NV_UNLOCKED = false;
const NV_SILENT = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
let KEEP_AUDIO = null;
const nvUnlock = () => { if (!KEEP_AUDIO && !navigator.audioSession){ try{ KEEP_AUDIO = new Audio(NV_SILENT); KEEP_AUDIO.loop = true; KEEP_AUDIO.setAttribute("playsinline", ""); const pk = KEEP_AUDIO.play(); if (pk && pk.catch) pk.catch(() => { KEEP_AUDIO = null; }); }catch(e){} }
  if (NV_UNLOCKED) return; NV_UNLOCKED = true; try{ NVA.src = NV_SILENT; const p = NVA.play(); if (p && p.catch) p.catch(() => { NV_UNLOCKED = false; }); }catch(e){ NV_UNLOCKED = false; }
  try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }catch(e){} };
["pointerdown","touchstart","click","keydown"].forEach(ev => document.addEventListener(ev, nvUnlock, {capture: true, passive: true}));
let NV_TOKEN = 0, NV_OFF_UNTIL = 0;
const nvOn = () => NV_OK && navigator.onLine && Date.now() > NV_OFF_UNTIL;
function stopAudio(){ NV_TOKEN++; try{ NVA.onended = NVA.onerror = NVA.ontimeupdate = null; NVA.pause(); }catch(e){} curAudio = null; }
function nvPlay(url, opts, onEnd, onFail){
  stopAudio(); const tok = NV_TOKEN; curAudio = NVA; let settled = false, retried = false;
  const live = () => tok === NV_TOKEN && !settled;
  const realFail = () => { if (!live()) return; settled = true; curAudio = null;
    if (++NV_FAILS >= 4){ NV_FAILS = 0; NV_OFF_UNTIL = Date.now() + 120000; }   // real outage: rest for 2 minutes, then try again
    onFail && onFail(); };
  NVA.onended = () => { if (!live()) return; settled = true; curAudio = null; NV_FAILS = 0; onEnd && onEnd(); };
  NVA.onerror = () => { if (!live()) return;
    if (!retried){ retried = true; setTimeout(() => { if (!live()) return; try{ NVA.load(); const p = NVA.play(); if (p && p.catch) p.catch(onCatch); }catch(e){ realFail(); } }, 700); return; }
    realFail(); };
  const onCatch = err => { if (!live()) return; const n = err && err.name;
    if (n === "AbortError") return;                                   // replaced by a newer line: not a failure
    if (n === "NotAllowedError"){ settled = true; curAudio = null; onFail && onFail(); return; }   // phone blocked it: robot for this line only
    realFail(); };
  NVA.src = url; NVA.volume = opts && opts.volume ? Math.min(1, opts.volume + 0.15) : 1; NVA.playbackRate = opts && opts.rate && opts.rate < 0.75 ? 0.92 : 1;
  const p = NVA.play(); if (p && p.catch) p.catch(onCatch);
  return NVA;
}
function robotSpeak(text, onend, opts){
  try{
    speechSynthesis.cancel();
    if (!voice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = opts.rate || 0.78; u.pitch = 1.0; u.volume = opts.volume || 0.8;
    if (voice) u.voice = voice;
    if (onend){ const ep = EPOCH; u.onend = () => { if(ep===EPOCH) onend(); }; }
    speechSynthesis.speak(u);
  }catch(e){ if(onend) later(onend, 2500); }
}
function clipURL(text, beast){ return "/api/tts?t=" + encodeURIComponent(text.trim().replace(/\s+/g, " ")) + (beast ? "&v=" + beast : ""); }
const NV_PRE = new Set(), NV_BLOBS = new Map();
const clipSrc = text => NV_BLOBS.get(text) || clipURL(text);
const NV_TS = new Map(), NV_TS_WAIT = new Map();
function nvTimed(text){
  if (NV_TS.has(text)) return Promise.resolve(NV_TS.get(text));
  if (NV_TS_WAIT.has(text)) return NV_TS_WAIT.get(text);
  const pr = fetch(clipURL(text) + "&ts=1").then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.a) return null;
    const bin = atob(j.a), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const e = {url: URL.createObjectURL(new Blob([bytes], {type: "audio/mpeg"})), chars: (j.c || []).join(""), starts: j.s || []}; NV_TS.set(text, e); return e;
  }).catch(() => null).finally(() => NV_TS_WAIT.delete(text));
  NV_TS_WAIT.set(text, pr); return pr;
}
function nvPrefetchTimed(texts){ if (!nvOn()) return; const q = texts.filter(Boolean); let active = 0;
  const next = () => { while (active < 1 && q.length){ active++; nvTimed(q.shift()).finally(() => { active--; next(); }); } }; next(); }
function nvPrefetch(texts){ if (!nvOn()) return; const q = texts.filter(t => t && !NV_PRE.has(t)); let active = 0;
  const next = () => { while (active < 1 && q.length){ const t = q.shift(); NV_PRE.add(t); active++; fetch(clipURL(t)).then(r => r.ok ? r.blob() : null).then(b => { if (b && b.size > 200) NV_BLOBS.set(t, URL.createObjectURL(b)); }).catch(() => {}).finally(() => { active--; next(); }); } }; next(); }
/* Long lines are spoken sentence by sentence. Each sentence is recorded once and reused everywhere,
   so "Bee is for Bonnie!" is shared by every game instead of being made again inside every new sentence. */
function splitSentences(t){ const parts = (t.match(/[^.!?…]+[.!?…]+["”’)]*|[^.!?…]+$/g) || [t]).map(x => x.trim()).filter(Boolean); const out = [];
  parts.forEach(pt => { if (out.length && out[out.length - 1].length < 14) out[out.length - 1] += " " + pt; else out.push(pt); }); return out; }
function speak(text, onend, opts={}){
  stopAudio(); try{ speechSynthesis.cancel(); }catch(e){}
  if (S.mute){ if (onend) later(onend, 700); return; }
  if (!nvOn() || !text) return robotSpeak(text, onend, opts);
  const ep = EPOCH, parts = opts.beast ? [text] : splitSentences(text); let i = 0;
  const next = () => { if (ep !== EPOCH) return; if (i >= parts.length){ if (onend) onend(); return; }
    const t = parts[i++]; if (parts[i]) nvPrefetch([parts[i]]);
    nvPlay(opts.beast ? clipURL(t, opts.beast) : clipSrc(t), opts, next, () => { if (ep === EPOCH) robotSpeak(parts.slice(i - 1).join(" "), onend, opts); }); };
  next();
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function award(n){
  if (!S.team) return;
  S.pts[S.team] += n;
  for (const k in S.pts) if (k !== S.team) S.pts[k] += Math.floor(Math.random()*(n+1));
  save();
}
function gotRight(b){
  S.correct[b.l] = (S.correct[b.l]||0) + 1;
  addFood(1);

  if (S.correct[b.l] >= 3 && !S.cards[b.l]){ S.cards[b.l] = true; toast(`New beast card: ${b.name}!`); }

}

/* Shared freehand drawing */
function freehand(cv, getStyle){
  const ctx = cv.getContext("2d"); let down = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
  cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); const [x,y] = pos(e);
    const s = getStyle(); ctx.globalCompositeOperation = "source-over"; ctx.strokeStyle = s.colour; ctx.lineWidth = s.size;
    ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); };
  cv.onpointermove = e => { if(!down) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => down = false;
  return ctx;
}

function trace(i, lower){

  const ctx = freehand(cv, () => ({colour, size: 34}));
  const P = ([x, y]) => [x*600, y*600];
  const lenOf = s => { let l = 0; for (let k = 1; k < s.length; k++) l += Math.hypot(s[k][0] - s[k-1][0], s[k][1] - s[k-1][1]); return l; };
  const pointAt = (s, f) => { let want = lenOf(s)*f; for (let k = 1; k < s.length; k++){ const d = Math.hypot(s[k][0] - s[k-1][0], s[k][1] - s[k-1][1]); if (want <= d || k === s.length - 1){ const t = d ? Math.min(1, want/d) : 0; return [s[k-1][0] + (s[k][0] - s[k-1][0])*t, s[k-1][1] + (s[k][1] - s[k-1][1])*t, Math.atan2(s[k][1] - s[k-1][1], s[k][0] - s[k-1][0])]; } want -= d; } return [...s[0], 0]; };
  const guide = (demoI, demoF) => {
    gv.clearRect(0, 0, 600, 600);
    // soft letter shape drawn from the strokes themselves, so it always lines up with the arrows
    gv.strokeStyle = "rgba(29,43,79,.08)"; gv.lineWidth = 64; gv.lineCap = gv.lineJoin = "round"; strokes.forEach(s => { gv.beginPath(); s.forEach((p, j) => { const [x, y] = P(p); j ? gv.lineTo(x, y) : gv.moveTo(x, y); }); gv.stroke(); });
    if (lower){ gv.strokeStyle = "rgba(58,134,255,.25)"; gv.lineWidth = 2; gv.setLineDash([8, 8]); [0.42, 0.82].forEach(y => { gv.beginPath(); gv.moveTo(20, y*600); gv.lineTo(580, y*600); gv.stroke(); }); gv.setLineDash([]); }
    strokes.forEach((s, k) => {
      const done = demoI != null && k < demoI;
      gv.strokeStyle = done ? colour : "rgba(29,43,79,.35)"; gv.lineWidth = done ? 30 : 5; gv.lineCap = gv.lineJoin = "round"; gv.setLineDash(done ? [] : [14, 12]);
      gv.beginPath(); s.forEach((p, j) => { const [x, y] = P(p); j ? gv.lineTo(x, y) : gv.moveTo(x, y); }); gv.stroke(); gv.setLineDash([]);
      if (demoI === k){ gv.strokeStyle = colour; gv.lineWidth = 30; gv.beginPath(); const n = Math.max(2, Math.round(s.length*demoF)); for (let j = 0; j <= 40*demoF; j++){ const [x, y] = P(pointAt(s, j/40)); j ? gv.lineTo(x, y) : gv.moveTo(x, y); } gv.stroke(); }
      if (lenOf(s) > 0.02){ [0.5].forEach(f => { const [x, y, a] = pointAt(s, f), [X, Y] = P([x, y]); gv.save(); gv.translate(X, Y); gv.rotate(a); gv.fillStyle = "rgba(230,57,70,.85)"; gv.beginPath(); gv.moveTo(16, 0); gv.lineTo(-8, -12); gv.lineTo(-8, 12); gv.closePath(); gv.fill(); gv.restore(); }); }
      const [sx, sy] = P(s[0]); gv.fillStyle = "#06D6A0"; gv.beginPath(); gv.arc(sx, sy, 22, 0, 7); gv.fill(); gv.strokeStyle = "#fff"; gv.lineWidth = 4; gv.stroke();
      gv.fillStyle = "#fff"; gv.font = "bold 24px Arial"; gv.textAlign = "center"; gv.textBaseline = "middle"; gv.fillText(String(k + 1), sx, sy + 1);
    });
    if (demoI != null && demoI < strokes.length){ const [x, y] = P(pointAt(strokes[demoI], demoF)); gv.fillStyle = "#FFD166"; gv.beginPath(); gv.arc(x, y, 20, 0, 7); gv.fill(); gv.strokeStyle = "#1D2B4F"; gv.lineWidth = 4; gv.stroke(); }
  };
  let demoTok = 0;
  const demo = () => { const my = ++demoTok; let k = 0, t0 = performance.now(); const dur = s => 600 + lenOf(s)*1300;
    const step = now => { if (my !== demoTok || !document.body.contains($("gv") || document.body)) return; const s = strokes[k]; if (!s){ guide(); return; }
      const f = Math.min(1, (now - t0)/dur(s)); guide(k, f); if (f >= 1){ k++; t0 = now + 250; } requestAnimationFrame(step); };
    requestAnimationFrame(step); speak(`Watch how to write ${lower ? "small" : "capital"} ${SAY[b.l]}.`); };
  if (document.fonts) document.fonts.ready.then(() => guide()); guide();
  $("show").onclick = demo; $("clear").onclick = () => ctx.clearRect(0, 0, 600, 600);
  CLEAN.push(() => demoTok++);
  later(demo, 500);
  $("done").onclick = () => {
    const first = !S.traced[b.l]; S.traced[b.l] = true; if (b.team === "place") S.cards[b.l] = true;
    if (first){ award(2); addFood(2); toast(`New sticker: ${b.l}!`); } save();
    speak(`Brilliant! That's ${lower ? "small" : "capital"} ${SAY[b.l]} for ${nm(b)}!`); confetti(); later(() => letter(i), 1800);
  };
}

function mcGame(title, gen, again){
  let round = 0, score = 0, last = null;
  const next = () => {
    if (round === 5) return finish(title, score, 5, again);
    round++;
    let r; do { r = gen(); } while (pool().length > 1 && r.b === last);
    last = r.b;
    let tries = 0;
    render(`${header(title, "games", "Games")}
      <div class="card"><p class="count">${round} of 5</p>${r.show}
        <button class="btn ghost" id="hear">🔊 Hear it</button>
        <div class="opts ${r.wide?"wide":""}">${r.opts.map(o=>`<button class="block" style="--c:${col(o)}" data-l="${o.l}" aria-label="${r.label?esc(o.name):o.l}">${r.label?r.label(o):o.l}</button>`).join("")}</div>
        <p class="feedback" id="fb" aria-live="polite"></p></div>`);
    $("hear").onclick = () => speak(r.say);
    speak(r.say);
    app.querySelectorAll(".opts .block").forEach(el => el.onclick = () => {
      if (el.dataset.l === r.b.l){
        if (tries === 0){ score++; gotRight(r.b); }
        app.querySelectorAll(".opts .block").forEach(x => x.disabled = true);
        $("fb").textContent = r.yes; speak(r.yesSay);
        later(next, 2000);
      } else {
        tries++; el.disabled = true; el.classList.add("wrong");
        $("fb").textContent = "Not quite. Try again!"; speak("Not quite. Try again!");
      }
    });
  };
  next();
}

function finish(title, score, of, again){
  const m = score === of ? "🥇" : score >= of - 2 ? "🥈" : "🥉";
  medal(m, title);
  render(`${header(title, "games", "Games")}
    <div class="card"><div class="medal">${m}</div><p class="say">You got ${score} out of ${of}!</p>
      <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" data-go="games">More games</button></div></div>`);
  speak(`Well done! You got ${score} out of ${of}!`);
  $("again").onclick = again;
}

/* Relay race (Book 2) */
function relay(){
  if (!S.team) return pickTeam(relay);
  const legs = ["The Jungle","Frost Lake","The Peaks","The Home Straight"];
  const teams = Object.keys(TEAMS);
  const pos = {}, spd = {}; teams.forEach(t => { pos[t] = 0; spd[t] = 3.2 + Math.random()*1.8; });
  const runnerL = t => TEAMS[t][Math.min(3, Math.floor(pos[t]/25))];
  render(`${header("Relay race", "games", "Games")}
    <div class="card">
      <p class="say" id="leg">Get ready…</p>
      <div class="legs"><span>Jungle</span><span>Frost Lake</span><span>Peaks</span><span>Home</span></div>
      <div class="lanes">${teams.map(t=>`<div class="lane ${t===S.team?"me":""}"><div class="runner" id="r-${t}" style="--c:${tcol(t)};left:0">${runnerL(t)}</div></div>`).join("")}</div>
      <button class="btn huge" id="run" style="--c:${tcol(S.team)}" disabled>Run!</button>
      <p class="feedback" id="fb" aria-live="polite"></p>
    </div>`);
  const draw = () => teams.forEach(t => { const el = $("r-"+t); if(!el) return;
    el.style.left = `calc((100% - 2.6rem) * ${Math.min(100,pos[t])/100})`; el.textContent = runnerL(t); });
  const done = [];
  let tick = null;
  const end = () => {
    clearInterval(tick);
    const place = done.indexOf(S.team) + 1; const pts = [10,6,3,1][place-1];
    award(pts); medal(["🥇","🥈","🥉","🏅"][place-1], "Relay race");
    $("run").disabled = true;
    const words = ["first","second","third","fourth"][place-1];
    $("fb").innerHTML = `${TEAMNAME[S.team]} came ${words}! +${pts} points<br><button class="btn" id="again" style="margin-top:.8rem">Race again</button>`;
    $("again").onclick = relay;
    speak(place === 1 ? `You won! ${TEAMNAME[S.team]} came first!` : `${TEAMNAME[S.team]} came ${words}. Great running!`);
  };
  const cross = t => { if (pos[t] >= 100 && !done.includes(t)){ done.push(t); if (t === S.team) end(); } };
  let started = false;
  const go = () => {
    if (started) return; started = true;
    $("run").disabled = false; $("leg").textContent = legs[0]; speak("Go!");
    tick = setInterval(() => {
      teams.forEach(t => { if (t !== S.team && pos[t] < 100){ pos[t] += spd[t]*0.1*(0.7+Math.random()*0.6); cross(t); } });
      draw();
    }, 100);
    CLEAN.push(() => clearInterval(tick));
  };
  $("run").onclick = () => {
    if (pos[S.team] >= 100) return;
    const before = Math.floor(pos[S.team]/25);
    pos[S.team] += 2;
    const after = Math.floor(pos[S.team]/25);
    if (after !== before && after < 4){ $("leg").textContent = legs[after]; }
    draw(); cross(S.team);
  };
  speak("Ready. Steady.", () => later(go, 300));
  later(go, 4000);
}

/* Jousting (Book 3) */
function joust(){
  if (!S.team) return pickTeam(joust);
  const me = byL(rnd(TEAMS[S.team].split("")));
  const rival = byL(rnd(Object.keys(TEAMS).filter(t=>t!==S.team).map(t=>rnd(TEAMS[t].split("")))));
  let myWins = 0, rivalWins = 0, pass = 0, x = 0, dir = 1, raf = null, live = false;
  render(`${header("Jousting", "games", "Games")}
    <div class="card">
      <div class="vs">
        <div><div class="runner" style="--c:${col(me)}">${me.l}</div>${esc(me.name)}<br><span id="mw">0</span></div>
        <div class="say">v</div>
        <div><div class="runner" style="--c:${col(rival)}">${rival.l}</div>${esc(rival.name)}<br><span id="rw">0</span></div>
      </div>
      <div class="bar"><div class="zone" style="left:30%;width:40%"></div><div class="zone inner" style="left:42%;width:16%"></div>
        <div class="marker" id="mk" style="left:0"></div></div>
      <button class="btn huge" id="strike" style="--c:${col(me)}">Strike!</button>
      <p class="feedback" id="fb" aria-live="polite">Tap when the line is in the green!</p>
    </div>`);
  let lastT = 0; const speed = 70; // % per second
  const loop = t => { if (!lastT) lastT = t; const dt = (t - lastT)/1000; lastT = t;
    if (live){ x += dir*speed*dt; if (x >= 100){ x = 100; dir = -1; } if (x <= 0){ x = 0; dir = 1; } const m = $("mk"); if (m) m.style.left = x + "%"; }
    raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop); CLEAN.push(() => cancelAnimationFrame(raf));
  const startPass = () => { pass++; x = 0; dir = 1; live = true; $("strike").disabled = false; $("fb").textContent = `Pass ${pass}: tap when the line is in the green!`; };
  $("strike").onclick = () => {
    if (!live) return; live = false; $("strike").disabled = true;
    const d = Math.abs(x - 50);
    const mine = d < 8 ? 3 : d < 20 ? 2 : 0;
    const theirs = rnd([0,1,2,2,2,3]);
    const words = {3:"Bullseye!",2:"Hit!",1:"Glancing blow",0:"Missed!"};
    let msg = `You: ${words[mine]} ${rival.name}: ${words[theirs]} `;
    if (mine > theirs){ myWins++; msg += "You win the pass!"; } else if (theirs > mine){ rivalWins++; msg += `${rival.name} wins the pass.`; } else msg += "It's a tie!";
    $("mw").textContent = myWins; $("rw").textContent = rivalWins; $("fb").textContent = msg;
    speak(mine > theirs ? `${words[mine]} You win the pass!` : theirs > mine ? `${nm(rival)} wins the pass.` : "It's a tie!");
    if (myWins === 2 || rivalWins === 2 || pass >= 5){
      const won = myWins > rivalWins;
      later(() => {
        if (won){ award(8); medal("🛡️","Jousting"); }
        $("fb").innerHTML = `${won ? `${esc(me.name)} wins the joust! +8 points` : myWins===rivalWins ? "It's a draw!" : `${esc(rival.name)} wins this time.`}
          <br><button class="btn" id="again" style="margin-top:.8rem">Joust again</button>`;
        $("again").onclick = joust;
        speak(won ? `${nm(me)} wins the joust!` : myWins===rivalWins ? "It's a draw!" : `${nm(rival)} wins this time. Try again!`);
      }, 1800);
    } else later(startPass, 2200);
  };
  speak(`${nm(me)} versus ${nm(rival)}. Tap when the line is in the green!`);
  startPass();
}

/* Capture the Chicken (Book 4) */
function chicken(){
  let round = 0, caught = 0;
  const next = () => {
    if (round === 3) return finish("Capture the Chicken", caught, 3, chicken);
    round++;
    const hide = Math.floor(Math.random()*16); let taps = 0, lastD = null; const max = 6;
    render(`${header("Capture the Chicken", "games", "Games")}
      <div class="card"><p class="count">Round ${round} of 3</p>
        <p class="say">Find the chicken!</p><p class="sub" id="left">${max} goes left</p>
        <div class="bushes">${Array.from({length:16},(_,i)=>`<button class="bush" data-i="${i}" aria-label="Bush ${i+1}">🌳</button>`).join("")}</div>
        <p class="feedback" id="fb" aria-live="polite"></p></div>`);
    speak("The chicken is hiding. Find the chicken!");
    const dist = (a,b) => Math.abs(a%4-b%4) + Math.abs(Math.floor(a/4)-Math.floor(b/4));
    const stop = () => app.querySelectorAll(".bush").forEach(x => x.disabled = true);
    app.querySelectorAll(".bush").forEach(el => el.onclick = () => {
      const i = +el.dataset.i; taps++; el.disabled = true;
      if (i === hide){ el.textContent = "🐔"; caught++; award(3); stop();
        $("fb").textContent = "You captured the chicken!"; speak("You captured the chicken!"); later(next, 2000); return; }
      el.textContent = "🍂";
      const d = dist(i, hide);
      const clue = lastD === null ? (d <= 2 ? "Close!" : "Not here!") : d < lastD ? "Warmer!" : d > lastD ? "Colder!" : "Not here!";
      lastD = d;
      $("left").textContent = `${max-taps} ${max-taps===1?"go":"goes"} left`;
      if (taps >= max){ stop(); const c = app.querySelector(`.bush[data-i="${hide}"]`); c.textContent = "🐔";
        $("fb").textContent = "The chicken got away!"; speak("Oh no, the chicken got away!"); later(next, 2400); }
      else { $("fb").textContent = clue; speak(clue); }
    });
  };
  next();
}

})();
const SQ_ICON = {boost:"✨",xander:"🕶️",yareli:"🫙",rainbow:"🌈",chicken:"🐔",start:"",finish:"🏁","":""};
const SQ_FILL = {boost:"#FFD166",xander:"#B8C0D6",yareli:"#F4A3A8",rainbow:"#A9D6FF",chicken:"#FFF3C4",start:"#FFFFFF",finish:"#FFFFFF","":"#FFF8E7"};
const sqXY = i => { const row = Math.floor(i/5), c = i%5, col = row%2 ? 4-c : c; return [44 + col*68, 408 - row*70]; };
const DICE = ["⚀","⚁","⚂","⚃","⚄","⚅"];

function boardPlay(list){
  const P = list.map((p,i) => ({...p, b:byL(p.l), pos:0, boosts:0, i}));
  let turn = 0, busy = false, over = false;
  const sq = TRAIL.map((t,i) => { const [x,y] = sqXY(i);
    return `<g><circle cx="${x}" cy="${y}" r="25" fill="${SQ_FILL[t]}" stroke="#1D2B4F" stroke-width="3"/>
      ${t==="start"?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2B4F">START</text>`
        : SQ_ICON[t] ? `<text x="${x}" y="${y+8}" text-anchor="middle" font-size="22">${SQ_ICON[t]}</text>`
        : `<text x="${x}" y="${y+6}" text-anchor="middle" font-size="16" font-weight="700" fill="#8A7A55">${i}</text>`}</g>`; }).join("");
  const pathD = TRAIL.map((_,i) => { const [x,y] = sqXY(i); return `${i?"L":"M"}${x} ${y}`; }).join(" ");
  const toks = P.map(p => `<g class="tok" id="tok${p.i}"><rect x="-13" y="-13" width="26" height="26" rx="6" fill="${getComputedStyle(document.documentElement).getPropertyValue(T[p.b.team]).trim()}" stroke="#fff" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">${p.l}</text></g>`).join("");
  render(`${header("Boost Trail", "games", "Games")}
    <div class="card" style="padding:.8rem">
      <svg class="board" viewBox="0 0 360 450" role="img" aria-label="Boost Trail board across New Rainbow Land">
        <rect x="0" y="0" width="360" height="450" rx="18" fill="#7FC8F8"/>
        <rect x="8" y="8" width="344" height="434" rx="40" fill="#9BD77A"/>
        <text x="330" y="36" font-size="20">🌳</text><text x="14" y="300" font-size="18">🌷</text><text x="318" y="250" font-size="18">⛰️</text><text x="16" y="120" font-size="18">🏰</text>
        <path d="${pathD}" fill="none" stroke="#E9C46A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
        ${sq}${toks}
      </svg>
      <div class="hud" id="hud"></div>
      <div class="row" style="align-items:center"><button class="dice" id="dice" aria-label="Roll the dice">🎲</button></div>
      <p class="feedback" id="fb" aria-live="polite"></p>
      <p class="note">✨ boost · 🕶️ Xander: back 3 · 🫙 Yareli steals a boost · 🌈 rainbow jump · 🐔 roll again · 3 boosts = power move!</p>
    </div>`);
  const offs = [[-9,-9],[9,-9],[-9,9],[9,9]];
  const place = p => { const [x,y] = sqXY(p.pos); const o = offs[p.i]; const g = $("tok"+p.i); if (g) g.style.transform = `translate(${x+o[0]}px, ${y+o[1]}px)`; };
  const hud = () => { const h = $("hud"); if (!h) return;
    h.innerHTML = P.map(p => `<div class="pl ${p.i===turn&&!over?"now":""}"><span class="runner" style="--c:${col(p.b)}">${p.l}</span>
      <span>${esc(p.b.name)}${p.cpu?" (computer)":""}</span><span class="bs">${p.boosts ? p.b.e.repeat(Math.min(p.boosts,6)) : "–"}</span></div>`).join(""); };
  const say = (msg, spoken) => { const f = $("fb"); if (f) f.textContent = msg; speak(spoken || msg); };
  P.forEach(place); hud();

  const move = (p, steps, dir, done) => {
    let k = 0;
    const step = () => {
      if (k >= steps || (dir > 0 && p.pos >= 29) || (dir < 0 && p.pos <= 0)) return done();
      p.pos += dir; k++; place(p);
      later(step, 330);
    };
    step();
  };

  const nextTurn = again => {
    if (over) return;
    if (!again) turn = (turn + 1) % P.length;
    hud();
    const p = P[turn];
    if (p.cpu){ $("dice").disabled = true; say(`${p.b.name}'s turn.`, `${nm(p.b)}'s turn.`); later(roll, 1600); }
    else { busy = false; $("dice").disabled = false; say(`${p.b.name}, roll the dice!`, `${nm(p.b)}, roll the dice!`); }
  };

  const win = p => {
    over = true; hud(); $("dice").disabled = true;
    const human = !p.cpu, solo = P.some(x => x.cpu);
    if (human && solo){ award(10); medal("🎲","Boost Trail"); }
    $("fb").innerHTML = `🏁 ${esc(p.b.name)} wins the Boost Trail!
      <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" data-go="games">More games</button></div>`;
    $("again").onclick = board;
    speak(`${nm(p.b)} wins the Boost Trail!`);
  };

  const powerCheck = (p, after) => {
    if (p.boosts >= 3){
      p.boosts -= 3; hud();
      say(`${p.b.name} uses ${p.b.power}! Move 3 more!`, `${nm(p.b)} uses ${p.b.power}! Move 3 more!`);
      later(() => move(p, 3, 1, () => p.pos >= 29 ? win(p) : after()), 1800);
    } else after();
  };

  const land = p => {
    if (p.pos >= 29) return win(p);
    const t = TRAIL[p.pos];
    const done = again => later(() => nextTurn(again), 1500);
    if (t === "boost"){
      p.boosts++; hud();
      say(`${p.b.e} ${p.b.name} picks up ${p.b.boost.toLowerCase()}!`, `${nm(p.b)} picks up ${p.b.boost}!`);
      return later(() => powerCheck(p, () => done(false)), 1600);
    }
    if (t === "xander"){
      say("Xander tricked you! Go back 3.");
      return later(() => move(p, 3, -1, () => done(false)), 1500);
    }
    if (t === "yareli"){
      if (p.boosts){ p.boosts--; hud(); say(`Yareli stole a boost from ${p.b.name}!`, `Yareli stole a boost from ${nm(p.b)}!`); }
      else say("Yareli looked for a boost, but there wasn't one to steal!");
      return done(false);
    }
    if (t === "rainbow"){
      say("Rainbow jump! Zoom ahead 4!");
      return later(() => move(p, 4, 1, () => p.pos >= 29 ? win(p) : land2(p)), 1300);
    }
    if (t === "chicken"){
      say("You found the chicken! Roll again!");
      return done(true);
    }
    done(false);
  };
  // after a rainbow jump, resolve only simple squares to avoid chains
  const land2 = p => { const t = TRAIL[p.pos];
    if (t === "boost"){ p.boosts++; hud(); say(`${p.b.e} ${p.b.name} picks up ${p.b.boost.toLowerCase()}!`, `${nm(p.b)} picks up ${p.b.boost}!`);
      return later(() => powerCheck(p, () => later(() => nextTurn(false), 1500)), 1600); }
    later(() => nextTurn(false), 1200); };

  const roll = () => {
    if (over) return;
    const p = P[turn];
    if (!p.cpu && busy) return;
    busy = true; $("dice").disabled = true;
    const n = 1 + Math.floor(Math.random()*6);
    let spins = 0;
    const spin = () => {
      if (spins++ < 8){ $("dice").textContent = rnd(DICE); return later(spin, 70); }
      $("dice").textContent = DICE[n-1];
      say(`${p.b.name} rolled a ${n}!`, `${n}!`);
      later(() => move(p, n, 1, () => land(p)), 900);
    };
    spin();
  };
  $("dice").onclick = roll;
  turn = -1; nextTurn(false);
}

  }, 1000);

function beastle(){

  const next = () => {
    if (round === 3){

      return;
    }
    round++;
    let b; do { b = rnd(pool()); } while (pool().length > 1 && b === last); last = b;
    const clues = [

    const opts = shuffle([b, ...shuffle(BEASTS.filter(x => x.l !== b.l && x.team !== "place")).slice(0,3)]);

        <p class="feedback" id="fb" aria-live="polite"></p></div>`);
    const draw = () => { $("cl").innerHTML = clues.slice(0, shown).map(c=>`<li>${esc(c)}</li>`).join("");
      $("more").disabled = shown >= clues.length; if (shown >= clues.length) $("more").style.opacity = .5; };
    draw();
    $("hear").onclick = () => speak(clues.slice(0, shown).map((_,k)=>spokenClue(k)).join(" "));
    speak("Who am I? " + spokenClue(0));
    $("more").onclick = () => { if (shown < clues.length){ shown++; draw(); speak(spokenClue(shown-1)); } };
    app.querySelectorAll(".opts .block").forEach(el => el.onclick = () => {
      if (el.dataset.l === b.l){
        const got = Math.max(1, 6 - shown); stars += got; solved++; gotRight(b); award(got);
        app.querySelectorAll(".opts .block, #more").forEach(x => x.disabled = true);
        $("fb").innerHTML = `Yes! I'm ${esc(b.name)}! <span class="stars">${"⭐".repeat(got)}</span>`;
        speak(`Yes! I'm ${nm(b)}!`); later(next, 2400);
      } else {
        el.disabled = true; el.classList.add("wrong");
        if (shown < clues.length){ shown++; draw(); $("fb").textContent = "Not me! Here's another clue."; speak("Not me! " + spokenClue(shown-1)); }
        else { $("fb").textContent = "Not me! Try again."; speak("Not me! Try again."); }
      }
    });
  };
  next();
}

      kitGrass(G, 900, () => [side(), legZ(2)], null, ["#7C8A6A","#8A9676","#6E7C5E"]);

      kitRocks(G, Array.from({length: 40}, () => [(R() < .5 ? -1 : 1)*(3 + R()*10), legZ(1), 1.3]), null, ["#FFFFFF","#EEF6FB","#DDEEF7"]);
      for (let k = 0; k < 8; k++) add(new T3.BoxGeometry(3 + R()*4, 0.02, 2 + R()*3), new T3.MeshPhongMaterial({color: "#BFE6F7", shininess: 100}), (R() < .5 ? -1 : 1)*(6 + R()*6), 0.02, legZ(1), false);

      const crowd = []; for (let z = -3*LEG - 4; z > -LEN + 2; z -= 0.55){ [-1, 1].forEach(sd => { crowd.push([sd*(7.6 + R()*0.3), 0.22, z]); crowd.push([sd*(8.4 + R()*0.3), 0.7, z + 0.2]); }); }
      [-1, 1].forEach(sd => add(new T3.BoxGeometry(2, 0.5, LEG), mat("#8D5B3C"), sd*8.1, 0.2, -3.5*LEG, true)); kitCrowd(G, crowd);

    add(new T3.BoxGeometry(4.8, 0.03, 0.6), mat("#ffffff"), 0, 0.02, -LEN, false);

      for (let i = 0; i < nObs; i++){ const x = LANES[lanes[i]];
        const log = G.rand() < .5, ob = log ? add(new T3.CylinderGeometry(0.28, 0.28, 1.2, 10), mat("#8D5B3C"), x, 0.28, z, true) : add(new T3.DodecahedronGeometry(0.45), mat("#8C8F99"), x, 0.4, z, true);
        if (log) ob.rotation.z = Math.PI/2; things.push({ob, x, z, kind:"hit"}); }
      if (G.rand() < .6){ const x = LANES[lanes[2]]; const c = add(new T3.CylinderGeometry(0.3, 0.3, 0.08, 16), mat("#FFD166", {emissive:"#6b4e00"}), x, 0.8, z, true); c.rotation.x = Math.PI/2; things.push({ob:c, x, z, kind:"boost"}); }
    }
    // runner meshes (swap each leg)

    // rivals on side tracks
    const rivalTeams = Object.keys(TEAMS).filter(t => t !== me.team).slice(0, 3);
    const rivals = rivalTeams.map((t, k) => { const b = byL(TEAMS[t][0]); const m = G.beast(b, 0.6); const x = [-4.2, 4.2, 6.4][k];
      add(new T3.BoxGeometry(1.4, 0.21, LEN + 20), mat("#E7CF98"), x, -0.09, -LEN/2, false);
      return {b, m, x, z: 0, speed: 9.4 + Math.random()*1.6, team: t}; });
    let lane = 1, px = 0, z = 0, speed = 0, slow = 0, legNo = 0, running = false, finished = false, boosts = 0, bounce = 0;
    const hud = () => { const h = $("hud"); if (!h) return;
      const pct = Math.min(100, (-z)/LEN*100);
      h.innerHTML = `<div class="slp now" style="--c:${col(runners[legNo])}"><span class="av">${runners[legNo].l}</span><span class="nm">${legs[legNo].n}</span><span class="sq">${Math.round(pct)}%</span></div>
        <div class="slp"><span class="nm">⚡ ${boosts}</span></div>`; };
    const move = d => { if (!finished) lane = Math.max(0, Math.min(2, lane + d)); };
    $("L").onclick = () => move(-1); $("R").onclick = () => move(1);
    let sx = null; G.el.addEventListener("pointerdown", e => sx = e.clientX);
    G.el.addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx; if (Math.abs(dx) > 25) move(dx > 0 ? 1 : -1); else move(e.clientX < G.el.getBoundingClientRect().left + G.el.clientWidth/2 ? -1 : 1); sx = null; });
    const key = e => { if (e.key === "ArrowLeft") move(-1); if (e.key === "ArrowRight") move(1); };
    window.addEventListener("keydown", key); CLEAN.push(() => window.removeEventListener("keydown", key));
    const finish = () => { finished = true;
      const place = 1 + rivals.filter(r => -r.z >= LEN).length; const pts = [10,6,3,1][place-1];
      award(pts); medal(["🥇","🥈","🥉","🏅"][place-1], "Relay Rumble");
      const words = ["first","second","third","fourth"][place-1];
      $("fb").innerHTML = `🏁 ${esc(TEAMNAME[me.team] || me.name)} came ${words}! ⚡ ${boosts} boosts, +${pts} points
        <div class="row"><button class="btn" id="again">Race again</button><button class="btn ghost" data-go="games">More games</button></div>`;
      $("again").onclick = relay3d; speak(place === 1 ? "You won the relay!" : `You came ${words}. Great running!`);

        slow = Math.max(0, slow - dt);

        speed += (target - speed) * Math.min(1, dt*2);
        z -= speed*dt;
        const nl = Math.min(3, Math.floor(-z/LEG));

          const b = runners[legNo]; $("fb").textContent = `${legs[legNo].n}! Over to ${b.name}!`; speak(`${legs[legNo].n}! Over to ${nm(b)}!`); }
        for (const t of things){ if (t.done) continue;

        for (const r of rivals){ if (-r.z < LEN) r.z -= r.speed*dt*(0.9 + Math.sin(now/900 + r.x)*0.12); }
        if (-z >= LEN) finish();
        hud();
      }
      px += (LANES[lane] - px) * Math.min(1, dt*10);

      const hop = running && !finished ? Math.abs(Math.sin(now/110))*0.18 : 0;
      meshes.forEach(m => { m.position.set(px, 0.42 + hop + bounce*0.6, z); m.rotation.y = bounce*6; });
      rivals.forEach(r => r.m.position.set(r.x, 0.36 + Math.abs(Math.sin(now/120 + r.x))*0.15, r.z));
      things.forEach(t => { if (t.kind === "boost" && !t.done) t.ob.rotation.z = now/300; });
      if (S.camHigh){ camera.position.set(px*0.3, 9.5, z + 7.5); camera.lookAt(px*0.2, 0, z - 3); } else { camera.position.set(px*0.5, 3.1, z + 6.2); camera.lookAt(px*0.3, 0.9, z - 6); }
      G.sun.position.set(8, 20, z + 10); G.sun.target.position.set(0, 0, z - 4);

    hud(); $("fb").textContent = "Ready…"; speak("Ready. Steady.");
    later(() => { running = true; $("fb").textContent = `Go! ${legs[0].n} first!`; speak("Go!"); }, 2200);
  });
}

/* ---------- ROYAL JOUST (Book 3) ---------- */
function joust3d(){ pickBeast("Hendrix's Joust", joust3dPlay); }
function joust3dPlay(me){
  const others = BEASTS.filter(b => b.team !== "place" && b.team !== me.team && b.l !== me.l);
  const rival = rnd(others);
  shell3D("Hendrix's Joust", "Tap Strike! when the line is in the green, right as the riders meet. First to win two passes wins the joust.",
    `<div class="bar"><div class="zone" style="left:30%;width:40%"></div><div class="zone inner" style="left:42%;width:16%"></div><div class="marker" id="mk" style="left:0"></div></div>
     <div class="row"><button class="btn huge" id="strike" style="--c:${col(me)}" disabled>Strike!</button></div>`);
  start3D(() => {
    const G = make3D({sky:["#5B8FD6","#A9D4F2","#FCE8C8"]}), {T3, camera, add, mat} = G;
    add(new T3.BoxGeometry(40, 0.2, 60), mat("#6DB84F"), 0, -0.1, 0, false).receiveShadow = true;
    add(new T3.BoxGeometry(7, 0.22, 34), mat("#E7CF98"), 0, -0.08, 0, false).receiveShadow = true;
    for (let z = -16; z <= 16; z += 2){ add(new T3.BoxGeometry(0.15, 0.9, 2), mat(z % 4 === 0 ? "#E63946" : "#FFFFFF"), 0, 0.45, z, true); }
    // stands and banners
    [-1, 1].forEach(s => { add(new T3.BoxGeometry(2.5, 1.6, 30), mat("#8D5B3C"), s*6, 0.8, 0, true);
      for (let z = -14; z <= 14; z += 1.1){ add(new T3.BoxGeometry(0.4, 0.5, 0.4), mat(RB[Math.floor(G.rand()*7)]), s*5.4, 1.85, z, false); add(new T3.SphereGeometry(0.18, 8, 6), mat("#F2D2B6"), s*5.4, 2.25, z, false); }
      for (let z = -12; z <= 12; z += 6){ add(new T3.CylinderGeometry(0.05, 0.05, 3, 6), mat("#fff"), s*7, 3, z, false); add(new T3.BoxGeometry(0.03, 1.2, 0.8), mat(RB[(z/6+3) % 7 | 0]), s*7, 3.8, z + 0.42, false); } });
    // royal box
    add(new T3.BoxGeometry(3, 2.4, 2), mat("#F3E9FF"), -7.5, 1.2, 0, true); add(new T3.ConeGeometry(1.2, 1.2, 4), mat("#6A4C93"), -7.5, 3, 0, true);
    // ---- detail pass
    kitLook(G); kitSky(G, {}); kitCastle(G, -16, 0, 0, 1.2).rotation.y = Math.PI/2;
    { const R = G.rand, ok = (x, z) => Math.abs(x) > 8.3 || Math.abs(z) > 17.5;
      kitGrass(G, 4500, () => { const x = (R() - .5)*40, z = (R() - .5)*50; return ok(x, z) ? [x, z] : null; }, null);
      kitTrees(G, Array.from({length: 40}, () => { const a = R()*6.28, r = 20 + R()*8; return [Math.cos(a)*r, Math.sin(a)*r, 1 + R()*0.8]; }), null, {pineShare: 0.3});
      kitFlowers(G, Array.from({length: 24}, () => { let x, z; do { x = (R() - .5)*30; z = (R() - .5)*40; } while (!ok(x, z)); return [x, z]; }), null);
      kitBushes(G, Array.from({length: 30}, () => [(R() < .5 ? -1 : 1)*(8.5 + R()*2), (R() - .5)*34]), null);
      const crowd = []; [-1, 1].forEach(sd => { for (let z = -14; z <= 14; z += 0.55) crowd.push([sd*6.6, 2.3, z + (R() - .5)*0.1]); });
      [-1, 1].forEach(sd => add(new T3.BoxGeometry(1.2, 2.2, 30), mat("#7A4A24"), sd*6.9, 1.1, 0, true)); kitCrowd(G, crowd);
      for (let z = -12; z <= 12; z += 6) kitBunting(G, [-7, 4.3, z], [7, 4.3, z], 0.8);
      [-1, 1].forEach(sd => { for (let z = -15; z <= 15; z += 5){ const p = add(new T3.CylinderGeometry(0.08, 0.08, 1.2, 8), mat("#FFD166"), sd*3.6, 0.6, z, true); add(new T3.SphereGeometry(0.12, 8, 6), mat("#FFD166"), sd*3.6, 1.25, z, false); } }); }
    const rider = (b, side) => { const base = add(new T3.BoxGeometry(0.9, 0.7, 1.6), mat(hexOf(b)), side*1.4, 0.55, 0, true);
      const m = G.beast(b, 0.6); const lance = add(new T3.CylinderGeometry(0.04, 0.09, 2.6, 8), mat("#FFD166"), 0, 0, 0, true); lance.rotation.x = Math.PI/2;
      return {b, base, m, lance, side, z: 0, off: 0}; };
    const A = rider(me, 1), B = rider(rival, -1);
    let myW = 0, rvW = 0, pass = 0, x = 0, dir = 1, live = false, t0 = 0, struck = null, knocked = null;
    const hud = () => { const h = $("hud"); if (h) h.innerHTML = `<div class="slp now" style="--c:${col(me)}"><span class="av">${me.l}</span><span class="nm">${esc(me.name)}</span><span class="sq">${myW}</span></div><div class="slp" style="--c:${col(rival)}"><span class="av">${rival.l}</span><span class="nm">${esc(rival.name)}</span><span class="sq">${rvW}</span></div>`; };
    const place = (r, z) => { r.z = z; r.base.position.set(r.side*1.4, 0.55 + Math.abs(Math.sin(z*2))*0.08, z); r.m.position.set(r.side*1.4, 1.3 + Math.abs(Math.sin(z*2))*0.08, z);
      r.lance.position.set(r.side*0.75, 1.3, z - r.side*0 + (r === A ? -1.1 : 1.1)); r.m.rotation.z = r.off; };
    const startPass = () => { pass++; live = true; struck = null; knocked = null; A.off = 0; B.off = 0; x = 0; dir = 1; t0 = performance.now();
      $("strike").disabled = false; $("fb").textContent = `Pass ${pass}: charge!`; speak("Charge!"); };
    $("strike").onclick = () => { if (!live || struck !== null) return; struck = Math.abs(x - 50); $("strike").disabled = true; };
    const resolve = () => {
      live = false; $("strike").disabled = true;
      const mine = struck === null ? 0 : struck < 8 ? 3 : struck < 20 ? 2 : 1, theirs = rnd([0,1,2,2,2,3]);
      const words = {3:"Bullseye!",2:"Hit!",1:"Glancing blow",0:"Missed!"};

      if (mine > theirs){ myW++; knocked = B; msg += "You win the pass!"; speak(`${words[mine]} You win the pass!`); }
      else if (theirs > mine){ rvW++; knocked = A; msg += `${rival.name} wins the pass.`; speak(`${nm(rival)} wins the pass.`); }

      $("fb").textContent = msg; hud();
      if (knocked){ const k = knocked; G.tween(700, t => { k.off = t*1.6*k.side; k.m.position.y = 1.3 + Math.sin(t*Math.PI)*0.8 - t*0.9; }); G.burst(0, 1.3, 0, 24, ["#FFD166","#ffffff","#E63946"], true); }
      if (myW === 2 || rvW === 2 || pass >= 5){
        later(() => { const won = myW > rvW;
          if (won){ award(8); medal("🛡️", "Royal Joust"); G.burst(0, 2, 0, 50, RB, true); }
          $("fb").innerHTML = `${won ? `${esc(me.name)} wins the joust! +8 points` : myW === rvW ? "It's a draw!" : `${esc(rival.name)} wins this time.`}
            <div class="row"><button class="btn" id="again">Joust again</button><button class="btn ghost" data-go="games">More games</button></div>`;
          $("again").onclick = joust3d; speak(won ? `${nm(me)} wins the joust!` : myW === rvW ? "It's a draw!" : `${nm(rival)} wins this time. Try again!`);
        }, 1600);
      } else later(startPass, 2600);
    };
    const DUR = 2300;
    G.onFrame((dt, now) => {
      if (live){ x += dir*70*dt; if (x >= 100){ x = 100; dir = -1; } if (x <= 0){ x = 0; dir = 1; } const mk = $("mk"); if (mk) mk.style.left = x + "%";
        const p = Math.min(1, (now - t0)/DUR); place(A, 14 - p*14); place(B, -14 + p*14); if (p >= 1) resolve(); }
      else if (!knocked){ place(A, A.z); place(B, B.z); }
      camera.position.set(3.2, 2.6, A.z + 5); camera.lookAt(-0.5, 1.1, A.z - 6);
    });
    place(A, 14); place(B, -14); hud();
    $("fb").textContent = `${me.name} versus ${rival.name}!`; speak(`${nm(me)} versus ${nm(rival)}! Tap strike when the line is in the green.`);
    later(startPass, 2600);
  });
}

    { const R = G.rand, isl = () => { const a = R()*6.28, r = Math.sqrt(R())*6.6; return [Math.cos(a)*r, Math.sin(a)*r]; };

      kitRocks(G, Array.from({length: 40}, () => { const a = R()*6.28, r = 7.8 + R()*0.9; return [Math.cos(a)*r, Math.sin(a)*r, 1.2]; }), (x, z) => -0.2);

      if (!k.human){ const lead = (me0.lap*N + me0.prog) - (k.lap*N + k.prog); maxV *= hard ? (lead > 60 ? 1.12 : lead < -80 ? 0.96 : 1) : (lead > 60 ? 1.08 : lead < -40 ? 0.82 : 1); }

    };

}
